name: Build and check Windows app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Check checksum and navigation behavior
        run: dotnet run --project tests/Logic/Logic.csproj
      - name: Check family appearance and saved-profile compatibility
        run: dotnet run --project tests/Appearance/Appearance.csproj
      - name: Check local browser authentication and vault compatibility
        run: dotnet run --project tests/Browser/Browser.csproj
      - name: Parse embedded Windows PowerShell resources
        shell: powershell
        run: ./tests/Check-PowerShell.ps1
      - name: Check collector interpretation with fixtures
        shell: powershell
        run: ./tests/Test-Collectors.ps1
      - name: Check security coverage and audit-first changes with mocks
        shell: powershell
        run: ./tests/Test-Coverage.ps1
      - name: Build Windows security checks
        run: dotnet build tests/WindowsSecurity/WindowsSecurity.csproj -c Release
      - name: Exercise authentication, encrypted backups and Windows collectors
        shell: pwsh
        run: |
          & ./tests/WindowsSecurity/bin/Release/net48/WindowsSecurity.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise isolated-profile failures and recovery
        shell: pwsh
        run: |
          dotnet build tests/Resilience/Resilience.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/Resilience/bin/Release/net48/Resilience.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows UI regression checks
        run: dotnet build tests/WindowsUi/WindowsUi.csproj -c Release
      - name: Check live-event recovery, status races, workspace, vault and signed reports
        shell: pwsh
        run: |
          dotnet build tests/Expansion/Expansion.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/Expansion/bin/Release/net48/Expansion.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify repeated unsigned builds
        shell: pwsh
        run: ./scripts/Test-ReproducibleBuild.ps1
      - name: Exercise pages and capture screenshots
        shell: pwsh
        run: |
          & ./tests/WindowsUi/bin/Release/net48/WindowsUi.exe "$PWD/ui-artifacts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build CLI
        run: dotnet build desktop/FishTank.csproj -c Release -p:BuildCli=true
      - name: Exercise update replacement and rollback in temporary directories
        shell: pwsh
        run: |
          dotnet build tests/UpdateFixture/UpdateFixture.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/Test-UpdateHelper.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise per-user installer file operations without registry changes
        shell: pwsh
        run: ./tests/Test-Installer.ps1
      - name: Package unsigned preview
        shell: pwsh
        run: ./scripts/Package-Preview.ps1 -NoBuild
      - name: Package initial Debian server deployment kit
        run: python scripts/Package-Server.py
      - name: Verify preview release preparation and malformed archive rejection
        shell: pwsh
        run: ./tests/Test-PreviewRelease.ps1
      - name: Verify complete server release asset
        shell: pwsh
        run: |
          ./tests/Test-ServerKit.ps1
          ./tests/Test-PreviewPublisher.ps1 -IncludeServer
      - name: Save unsigned Windows builds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FishTank-unsigned-development
          path: |
            packages/FishTank-desktop-preview.zip
            packages/FishTank-server-kit.zip
      - name: Save UI review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FishTank-ui-review
          path: ui-artifacts/
          if-no-files-found: ignore

  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Check local server and build UI fixture
        run: dotnet run --project tests/Browser/Browser.csproj
      - name: Install browser test dependency
        run: |
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium
      - name: Exercise responsive browser UI and credential flows
        run: python3 tests/browser-ui.py
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FishTank-browser-review
          path: browser-artifacts/
          if-no-files-found: ignore

  server-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned server dependencies
        run: python3 -m pip install -r server/requirements.lock
      - name: Check OTP, WebAuthn cryptography and signed status boundaries
        run: python3 -m unittest discover -s server -v
      - name: Scan source credentials and generate SBOM
        run: python3 scripts/Check-Source.py
      - name: Audit pinned server dependencies
        run: |
          python3 -m pip install pip-audit==2.10.1
          python3 -m pip_audit -r server/requirements.lock
      - name: Save dependency SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FishTank-dependencies
          path: packages/FishTank-sbom.json

  preview-release:
    name: Publish tested preview update
    needs: [windows, browser-ui, server-and-source]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'KailanBess/FishTank'
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: fishtank-preview-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish validated preview assets after all checks pass
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Publish-Preview.ps1 -IncludeServer
