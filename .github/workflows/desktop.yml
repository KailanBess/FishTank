name: Build and check Windows app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Check checksum and navigation behavior
        run: dotnet run --project tests/Logic/Logic.csproj
      - name: Parse embedded Windows PowerShell resources
        shell: powershell
        run: ./tests/Check-PowerShell.ps1
      - name: Check collector interpretation with fixtures
        shell: powershell
        run: ./tests/Test-Collectors.ps1
      - name: Build Windows security checks
        run: dotnet build tests/WindowsSecurity/WindowsSecurity.csproj -c Release
      - name: Exercise authentication, encrypted backups and Windows collectors
        shell: pwsh
        run: |
          & ./tests/WindowsSecurity/bin/Release/net48/WindowsSecurity.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows UI regression checks
        run: dotnet build tests/WindowsUi/WindowsUi.csproj -c Release
      - name: Exercise pages and capture screenshots
        shell: pwsh
        run: |
          & ./tests/WindowsUi/bin/Release/net48/WindowsUi.exe "$PWD/ui-artifacts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build CLI
        run: dotnet build desktop/FishTank.csproj -c Release -p:BuildCli=true
      - name: Exercise update replacement and rollback in temporary directories
        shell: pwsh
        run: |
          dotnet build tests/UpdateFixture/UpdateFixture.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/Test-UpdateHelper.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package unsigned preview
        shell: pwsh
        run: ./scripts/Package-Preview.ps1 -NoBuild
      - name: Save unsigned Windows builds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FishTank-unsigned-development
          path: |
            packages/FishTank-desktop-preview.zip
      - name: Save UI review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FishTank-ui-review
          path: ui-artifacts/
          if-no-files-found: ignore
